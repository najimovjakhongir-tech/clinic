<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f7fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1730" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ortho CRM">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
*{-webkit-tap-highlight-color:transparent}
</style>
<title>Ortho CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column app — patient list → patient card with visit timeline → bottom sheet for a visit */
:root{
  --bg:#f3f7fc; --surface:#ffffff; --fg:#0e2347; --muted:#5b6f8e; --line:#d8e3f0;
  --navy:#184483; --sky:#2eaed2; --sky-soft:#e2f4fa; --on-sky:#ffffff; --danger:#d0393b; --ok:#1f9d63;
  --up:#184483; --low:#2a9bc0;
  --display:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1730; --surface:#11244a; --fg:#e8f0fb; --muted:#93a9c9; --line:#213a63;
  --navy:#8fb6ee; --sky:#6bcee4; --sky-soft:#173a5e; --on-sky:#0a1730; --danger:#ef6466; --ok:#3cc285;
  --up:#a9c7f2; --low:#6bcee4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1730; --surface:#11244a; --fg:#e8f0fb; --muted:#93a9c9; --line:#213a63;
  --navy:#8fb6ee; --sky:#6bcee4; --sky-soft:#173a5e; --on-sky:#0a1730; --danger:#ef6466; --ok:#3cc285;
  --up:#a9c7f2; --low:#6bcee4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:10px}
.brand{display:flex;flex-direction:column;line-height:1.1;flex:1;min-width:0}
.brand b{font-weight:800;font-size:19px;letter-spacing:-.01em;color:var(--navy)}
.brand span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--navy);color:var(--surface)}
.btn.sky{background:var(--sky);color:var(--on-sky)}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--line)}
.btn:focus-visible,.icon:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.icon{border:0;background:transparent;color:var(--navy);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.prow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;color:var(--fg);width:100%}
.ava{width:42px;height:42px;border-radius:50%;background:var(--sky-soft);color:var(--navy);display:grid;place-items:center;font-weight:800;flex:none}
.prow .meta{flex:1;min-width:0}
.prow .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .sub{font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.chev{color:var(--muted);font-size:20px}
.dur{align-self:flex-start;flex:none;text-align:right;line-height:1.15}
.dur b{display:block;font-size:13.5px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.dur small{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.empty{color:var(--muted);text-align:center;padding:40px 10px;line-height:1.5}
.ex{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--sky);border:1px solid var(--sky);border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:2px}

.phead{display:flex;gap:14px;align-items:center;margin-top:4px}
.phead .ava{width:56px;height:56px;font-size:20px}
.phead h1{margin:0;font-size:22px;text-wrap:balance}
.phead .sub{color:var(--muted);font-size:13px;margin-top:3px}
.now{margin-top:16px;background:var(--navy);color:var(--surface);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.now small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:3px}
.now .w{font-family:var(--mono);font-size:14px}
.sect{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.sect h2{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.timeline{display:flex;flex-direction:column;gap:10px}
.visit{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--fg);width:100%;display:grid;grid-template-columns:62px 1fr;gap:12px}
.vdate{font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.15}
.vdate .d{font-size:20px;font-weight:500;color:var(--navy)}
.vdate .y{font-size:11.5px;color:var(--muted)}
.vdate .n{font-size:10.5px;color:var(--muted);margin-top:6px}
.vbody{min-width:0;display:flex;flex-direction:column;gap:7px}
.arch{display:flex;gap:8px;align-items:baseline;font-size:14px}
.tag{font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px;flex:none;color:#fff}
.tag.u{background:var(--up)} .tag.l{background:var(--low)}
:root[data-theme="dark"] .tag.u{color:#0b1322}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.u{color:#0b1322}}
.wire{font-family:var(--mono);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;background:var(--sky-soft);color:var(--fg);border-radius:8px;padding:4px 8px}
.chip b{font-weight:700;color:var(--navy)}
.vcom{font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px}
.nothing{font-size:13px;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.vst{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--stc)}
.vst i{width:9px;height:9px;border-radius:50%;background:var(--stc)}
.blogo{height:58px;width:auto;max-width:100%;display:block}
.blogo.dk{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .blogo.lt{display:none}:root:not([data-theme="light"]) .blogo.dk{display:block}}
:root[data-theme="dark"] .blogo.lt{display:none}:root[data-theme="dark"] .blogo.dk{display:block}
.brandmark{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;color:var(--fg);text-align:left;min-width:0}
.mtop .pill.grp button{width:38px}
.mtop .pill.grp{padding:0 2px}
.mono{width:42px;height:42px;border-radius:50%;background:#13294b;display:grid;place-items:center;position:relative;flex:none;box-shadow:inset 0 0 0 2px #4aa8e0;font-family:var(--display);letter-spacing:-.04em}
.mono b{color:#fff;font-size:20px;font-weight:800;line-height:1;transform:translateX(-3px)}
.mono i{position:absolute;right:9px;bottom:10px;color:#4aa8e0;font-style:normal;font-weight:800;font-size:14px;line-height:1}
.bname{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.bname{overflow:hidden}
.bname b{font-size:13.5px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bname small{font-size:8.5px;font-weight:800;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;color:var(--sky);white-space:nowrap}
.mtitle h1 small{font-size:17px;font-weight:700;color:var(--muted);letter-spacing:0}
.yrbtn{border:0;background:var(--sky-soft);color:var(--navy);font-weight:800;font-size:16px;border-radius:10px;padding:4px 10px;vertical-align:5px;margin-left:4px;font-family:var(--display)}
.ysheet .yhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ysheet .yhead b{font-size:26px;font-weight:800;color:var(--navy)}
.ygrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
@media (min-width:560px){.ygrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ym{min-width:0}
.ym .mn{border:0;background:transparent;color:var(--danger);font-weight:800;font-size:14px;padding:2px 0 4px;text-align:left;width:100%}
.ym .mn.other{color:var(--fg)}
.ym .g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px}
.ym .g button,.ym .g span{border:0;background:transparent;color:var(--fg);font-size:10px;font-weight:600;padding:0;height:17px;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.ym .g button.we{color:var(--muted)}
.ym .g button.td{background:var(--danger);color:#fff}
.ym .g button.has::after{content:"";display:block}
.ym .g button.has{box-shadow:inset 0 -2px 0 var(--sky)}
.ym.cur{background:var(--sky-soft);border-radius:10px;padding:4px;margin:-4px}
.badge{position:absolute;top:4px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.phrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.phnum{font-family:var(--mono);font-size:14px;color:var(--fg);-webkit-user-select:all;user-select:all;margin-right:2px}
.phbtn{border:1.5px solid var(--line);background:var(--surface);color:var(--navy);font-weight:700;font-size:12.5px;border-radius:9px;padding:5px 10px;text-decoration:none;font-family:var(--display)}
.phbtn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.dchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--fg)}
.dchip i{width:9px;height:9px;border-radius:50%;background:var(--dc);flex:none}
.cdot{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.cdot.on{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--surface)}
.permall{display:flex;gap:8px;margin-bottom:6px}.permall .btn{flex:1;padding:9px}
.pgh{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.plist{display:flex;flex-direction:column;gap:6px}
.perm{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:10px 12px}
.perm b{display:block;font-size:14px}.perm small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.perm .sw{width:38px;height:22px;border-radius:11px;background:var(--line);flex:none;position:relative;margin-top:1px;transition:background .15s}
.perm .sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.perm.on{border-color:var(--navy)}.perm.on .sw{background:var(--ok)}.perm.on .sw i{left:18px}
.anseg{grid-template-columns:repeat(4,1fr)!important;margin:4px 0 14px}.anseg button{padding:8px 4px;font-size:13px}
.kts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.kts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kt b{font-size:26px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.kt span{font-size:12.5px;font-weight:600}.kt small{font-size:11.5px;color:var(--muted)}
.kt.warn b{color:var(--danger)}
section.an{margin-top:22px}
.anh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.anh h2{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.anh span{font-size:12px;color:var(--muted)}
.hb{display:flex;flex-direction:column;gap:7px}
.hbr{display:grid;grid-template-columns:minmax(0,42%) 1fr auto;gap:10px;align-items:center}
.hbl{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0}.hbl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbl i{width:9px;height:9px;border-radius:50%;flex:none}
.hbt{height:12px;background:color-mix(in srgb,var(--line) 55%,transparent);border-radius:6px;overflow:hidden}
.hbf{height:100%;border-radius:6px}
.hbv{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;min-width:28px}.hbv small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:150px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px 8px}
.vbc{display:flex;flex-direction:column;align-items:center;height:100%;min-width:0}
.vbv{font-size:10.5px;font-weight:800;color:var(--fg);height:14px;font-variant-numeric:tabular-nums}
.vbt{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.vbf{width:70%;max-width:22px;background:color-mix(in srgb,var(--navy) 55%,var(--surface));border-radius:4px 4px 0 0}
.vbf.cur{background:var(--navy)}
.vbl{font-size:9.5px;color:var(--muted);margin-top:4px;white-space:nowrap}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.tbl table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}.tbl tbody tr[data-a]{cursor:pointer}
.vbf.nw{background:color-mix(in srgb,var(--sky) 55%,var(--surface))}.vbf.nw.cur{background:var(--sky)}
.yrnav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px}.yrnav b{font-size:20px;font-weight:800;color:var(--navy)}
.tbl tr.fut td{color:var(--muted)}.tbl tr.curm td{background:var(--sky-soft)}.tbl tr.tot td{font-weight:800;border-top:2px solid var(--line)}
.hbl span{white-space:pre}
.antabs{display:flex;gap:6px;overflow-x:auto;margin:16px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.antabs::-webkit-scrollbar{display:none}
.antabs button{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-weight:700;font-size:14px;border-radius:999px;padding:8px 14px;font-family:var(--display)}
.antabs button.on{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.anwrap section.an{display:none}
.anwrap[data-tab="over"] section[data-tab="over"],.anwrap[data-tab="src"] section[data-tab="src"],.anwrap[data-tab="docs"] section[data-tab="docs"],.anwrap[data-tab="treat"] section[data-tab="treat"],.anwrap[data-tab="labs"] section[data-tab="labs"],.anwrap[data-tab="pats"] section[data-tab="pats"]{display:block}
.rpt{position:fixed;left:-12000px;top:0;width:760px;padding:8px;font-family:var(--display);
  --bg:#ffffff;--surface:#ffffff;--fg:#0e2347;--muted:#5b6f8e;--line:#d8e3f0;--navy:#184483;--sky:#2eaed2;--sky-soft:#e2f4fa;--danger:#d0393b;--ok:#1f9d63;color:#0e2347;background:#fff}
.rpt section.an{display:block;margin-top:0;padding:4px}
.rpt .kts{grid-template-columns:repeat(3,1fr);padding:4px}
.rpt .tbl{overflow:visible}.rpt .tbl table{font-size:12px}
.rpt .vb{height:170px}
.rpt .yrnav b{font-size:16px}
.rpth{display:flex;align-items:center;gap:16px;padding:4px 4px 10px;border-bottom:2px solid #184483;margin-bottom:6px}
.rpth img{height:64px}.rpth b{display:block;font-size:22px;color:#184483}.rpth span{font-size:13px;color:#5b6f8e}
.nextbtn{width:100%;border:0;background:var(--navy);color:var(--surface);font-weight:800;font-size:15px;border-radius:14px;padding:14px;margin:4px 0 12px;font-family:var(--display)}
.nextok{width:100%;background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok);font-weight:800;border-radius:14px;padding:14px;margin:4px 0 12px;text-align:center}
.tl2{position:relative;margin-top:6px}
.tl2 .hrow{position:absolute;left:0;right:0;height:84px;min-height:0;display:block;border-bottom:0;border-top:1px solid var(--line)}
.tl2 .hl{position:absolute;left:0;top:4px;padding:0}
.tl2 .hrow.drop{background:var(--sky-soft)}
.evs{position:absolute;left:52px;right:0;top:0;bottom:0;pointer-events:none}
.evbox{position:absolute;pointer-events:auto;padding:0}
.evbox .appt.ev{height:100%;margin:0;border-radius:10px}
.appt.ev .go{cursor:pointer;padding:2px 6px 2px 5px;align-items:flex-start;justify-content:flex-start;gap:0}
.stb.sm{width:20px;padding:0;justify-content:flex-start;padding-top:5px;gap:0}
.stb.sm i{width:11px;height:11px}
.evt{min-width:0;width:100%;display:flex;flex-direction:column;gap:0;overflow:hidden;line-height:1.15}
.evt b{font-size:13.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evl1{display:flex;align-items:baseline;gap:5px;min-width:0;margin-top:0}.evl1 b{flex:1;min-width:0}
.evl1 .evtm{flex:none;font-size:11px}
.evsub{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;line-height:1.2}
.evtm{font-family:var(--mono);color:var(--fg);font-weight:500}
.rz{position:absolute;left:30%;right:30%;height:14px;cursor:ns-resize;touch-action:none;z-index:2}
.rzt{top:-6px}.rzb{bottom:-6px}
.rz::after{content:"";position:absolute;left:50%;top:50%;width:28px;height:4px;margin:-2px 0 0 -14px;border-radius:2px;background:var(--stc,var(--navy));opacity:.55}
.evbox.rzing .appt{box-shadow:0 0 0 2px var(--sky)}
.evinfo{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}

<script>
/* ===== Supabase adapter: gives the app the same db / user / assets / downloads it had inside Claude ===== */
(function(){
  const SB_URL="https://ivejkzanljkjdjkwyggr.supabase.co";
  const SB_KEY="sb_publishable_wmGCZZxIAR47-EwEdXx18g__IYTV0oX";
  const OWNER_EMAIL="najimovjakhongir@gmail.com";
  const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  window.__sb=sb;
  let session=null, readyRes; const ready=new Promise(r=>readyRes=r);
  const err=e=>({code:e?.code==="42501"||/row-level security/i.test(e?.message||"")?"permission_denied":(e?.code||"upstream_error"),message:e?.message||String(e)});

  /* ---------- db ---------- */
  function collection(col){
    return {onSnapshot(cb,onErr){
      const map=new Map(); let alive=true;
      const emit=()=>{if(alive)cb({docs:[...map].map(([id,data])=>({id,data:()=>data})),size:map.size,metadata:{fromCache:false}})};
      (async()=>{try{let from=0; for(;;){const {data,error}=await sb.from("docs").select("id,data").eq("collection",col).range(from,from+999);
          if(error)throw error; data.forEach(r=>map.set(r.id,r.data)); if(data.length<1000)break; from+=1000}
          emit()}catch(e){onErr&&onErr(err(e))}})();
      const ch=sb.channel("docs_"+col+"_"+Math.random().toString(36).slice(2))
        .on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"collection=eq."+col},p=>{
          if(p.eventType==="DELETE"){if(p.old?.id)map.delete(p.old.id)} else if(p.new){map.set(p.new.id,p.new.data)} emit()})
        .subscribe();
      return ()=>{alive=false; sb.removeChannel(ch)};
    }};
  }
  function doc(path){const i=path.indexOf("/"), col=path.slice(0,i), id=path.slice(i+1);
    return {
      async set(body){const {error}=await sb.from("docs").upsert({collection:col,id,data:body}); if(error)throw err(error)},
      async delete(){const {error}=await sb.from("docs").delete().eq("collection",col).eq("id",id); if(error)throw err(error)}
    }}
  const db={collection,doc};

  /* ---------- user ---------- */
  const user={
    id:async()=>session?.user?.id||null,
    isOwner:async()=>!!session&&(session.user.email||"").toLowerCase()===OWNER_EMAIL,
    email:()=>session?.user?.email||"",
    async profiles(ids){const out={}; const docs=window.doctors||[], cl=window.claims||[];
      ids.forEach(id=>{const d=docs.find(x=>x.uid===id), c=cl.find(x=>x.id===id); out[id]={name:(d&&d.email)||(c&&c.email)||(id===session?.user?.id?session.user.email:"")||""}}); return out}
  };

  /* ---------- photos ---------- */
  const assets={async upload(blob,o){const id=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2))+".jpg";
      const {error}=await sb.storage.from("photos").upload(id,blob,{contentType:o?.type||blob.type||"image/jpeg",upsert:false});
      if(error)throw {code:/size|large/i.test(error.message)?"too_large":"upstream_error",message:error.message};
      return {id,url:"",sizeBytes:blob.size,contentType:o?.type||blob.type}},
    async delete(id){await sb.storage.from("photos").remove([id]); return {deleted:true}}};
  const urlCache={}, pending=new Set(); let tmr=0;
  const PIX="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
  window.__photoUrl=id=>{if(!id)return PIX; const c=urlCache[id]; if(c&&c.exp>Date.now())return c.url; pending.add(id); clearTimeout(tmr); tmr=setTimeout(fetchUrls,30); return PIX};
  async function fetchUrls(){const ids=[...pending]; pending.clear(); if(!ids.length||!session)return;
    const {data,error}=await sb.storage.from("photos").createSignedUrls(ids,60*60*12); if(error||!data)return;
    data.forEach(r=>{if(r.signedUrl)urlCache[r.path]={url:r.signedUrl,exp:Date.now()+1000*60*60*11}});
    try{window.render&&window.render(); if(window.sheet&&window.drawSheet&&window.sheet.kind!=="crop")window.drawSheet()}catch(e){}}

  /* ---------- downloads ---------- */
  const downloads={async save({filename,data}){
    const type=/\.pdf$/i.test(filename)?"application/pdf":/\.json$/i.test(filename)?"application/json":"application/octet-stream";
    const blob=data instanceof Blob?data:new Blob([data],{type}); const file=new File([blob],filename,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:filename}); return {status:"saved"}}catch(e){if(e?.name==="AbortError")throw {code:"declined"}}}
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove()},4000); return {status:"saved"}}};

  window.claude={use:async name=>{await ready; return {db,user,assets,downloads}[name]||null}};

  /* ---------- login screen ---------- */
  const box=document.getElementById("auth");
  const msg=t=>{const m=document.getElementById("authmsg"); m.textContent=t||""; m.hidden=!t};
  function showLogin(){box.hidden=false}
  async function start(s){session=s; box.hidden=true; readyRes()}
  sb.auth.getSession().then(({data})=>{if(data.session)start(data.session); else showLogin()});
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_OUT"){location.reload()} else if(s&&!session)start(s); else if(s)session=s});
  document.getElementById("authform").addEventListener("submit",async e=>{e.preventDefault();
    const email=document.getElementById("aemail").value.trim(), pass=document.getElementById("apass").value, mode=e.submitter?.dataset.mode||"in";
    if(!email||pass.length<6){msg("Введите почту и пароль не короче 6 символов");return}
    const btns=box.querySelectorAll("button"); btns.forEach(b=>b.disabled=true); msg("");
    try{
      if(mode==="up"){const {data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:location.origin+location.pathname}}); if(error)throw error;
        if(!data.session)msg("Аккаунт создан. Откройте письмо от Supabase, подтвердите почту и войдите здесь.")}
      else if(mode==="reset"){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}); if(error)throw error; msg("Письмо для смены пароля отправлено на "+email)}
      else {const {error}=await sb.auth.signInWithPassword({email,password:pass}); if(error)throw error}
    }catch(e){msg(/Invalid login/i.test(e.message)?"Неверная почта или пароль":/not confirmed/i.test(e.message)?"Почта ещё не подтверждена — откройте письмо от Supabase":/already registered/i.test(e.message)?"Такой аккаунт уже есть — нажмите «Войти»":"Ошибка: "+e.message)}
    btns.forEach(b=>b.disabled=false)});
  sb.auth.onAuthStateChange(async(ev)=>{if(ev==="PASSWORD_RECOVERY"){const np=prompt("Новый пароль (не короче 6 символов)"); if(np&&np.length>=6){await sb.auth.updateUser({password:np})}}});
  window.appSignOut=async()=>{await sb.auth.signOut(); location.reload()};
})();

</script>

function norm(p){(p.visits||[]).forEach(v=>{if(v.exam===OLD_EXAM)v.exam=NEW_EXAM});
  const appts=p.appts||[]; let changed=false; p.visits=(p.visits||[]).map(v=>{if(!v.status){changed=true; return {...v,status:"came"}} return v});
  appts.forEach(a=>{changed=true; const same=p.visits.find(v=>v.date===a.date&&!v.time);
    if(same){same.time=a.time||""; same.status=a.status||same.status; if(!same.comment)same.comment=a.note||""}
    else p.visits.push({id:a.id,date:a.date,time:a.time||"",status:a.status||"plan",comment:a.note||"",screws:[],elastics:[],bends:[]})});
  if(p.appts){delete p.appts; changed=true}
  return changed;
}

/* ---------- trash: deleted items kept 30 days ---------- */
let trash=[]; const TKEY="ortho-trash-v1", TDAYS=30;
function saveTrashLocal(){try{localStorage.setItem(TKEY,JSON.stringify(trash))}catch(e){}}
async function toTrash(item){item.id=uid(); item.at=Date.now(); trash.push(item); if(view.screen==="trash")render();
  if(useLocal){saveTrashLocal();return} try{const {id,...b}=item; await db.doc("trash/"+id).set(b)}catch(e){}}
async function dropTrash(id){trash=trash.filter(x=>x.id!==id); if(useLocal){saveTrashLocal();return} try{await db.doc("trash/"+id).delete()}catch(e){}}
function purgeTrash(){const lim=Date.now()-TDAYS*864e5; trash.filter(x=>(x.at||0)<lim).forEach(x=>dropTrash(x.id))}
function deleteVisit(pid,vid){const pp=patients.find(x=>x.id===pid); if(!pp)return; const v=(pp.visits||[]).find(x=>x.id===vid); if(!canTouch(v)||!canDo("del"))return;
  if(v)toTrash({kind:"visit",pid,pname:pp.name,visit:clone(v)});
  const pc=clone(pp); pc.visits=(pc.visits||[]).filter(x=>x.id!==vid); savePatient(pc)}
function restoreTrash(id){const it=trash.find(x=>x.id===id); if(!it)return;
  if(it.kind==="visit"){const pp=patients.find(x=>x.id===it.pid);
    if(pp){const pc=clone(pp); pc.visits=pc.visits||[]; if(!pc.visits.some(v=>v.id===it.visit.id))pc.visits.push(it.visit); savePatient(pc)}
    else savePatient({id:it.pid,name:it.pname||"Пациент",phone:"",note:"",visits:[it.visit]})}
  else if(it.kind==="photo"){const pp=patients.find(x=>x.id===it.pid); if(pp){const pc=clone(pp); pc.photos=pc.photos||[]; if(!pc.photos.some(y=>y.id===it.photo.id))pc.photos.push(it.photo); savePatient(pc)}}
  else if(it.kind==="patient"){const ex=patients.find(x=>x.id===it.patient.id);
    if(ex){const pc=clone(ex); const ids=new Set((pc.visits||[]).map(v=>v.id)); pc.visits=[...(pc.visits||[]),...(it.patient.visits||[]).filter(v=>!ids.has(v.id))]; savePatient(pc)}
    else savePatient(clone(it.patient))}
  dropTrash(id); render()}

  return `<header class="top"><button class="icon" data-a="all" aria-label="Назад">‹</button>
    <div class="brand"><b>Корзина</b><span>хранится ${TDAYS} дней</span></div></header>

const iso=(y,m,d)=>y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
const dayTitle=s=>{const[y,m,d]=s.split("-").map(Number);return d+" "+MONG[m-1]+", "+WD[new Date(y,m-1,d).getDay()]};
const cellName=n=>(n||"").split(/\s+/).filter(Boolean).slice(0,2).join(" ");
const pad2=h=>String(h).padStart(2,"0");
const shortName=n=>{const w=(n||"").split(/\s+/).filter(Boolean);return w.length>1?w[0]+" "+w.slice(1,3).map(x=>x[0].toUpperCase()+".").join(""):(w[0]||"")};
let cal=(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()}})(), sel=today(), showAll=false;
const ST={plan:{t:"Записан",c:"var(--st-plan)"},came:{t:"Пришёл",c:"var(--st-came)"},noshow:{t:"Не пришёл",c:"var(--st-noshow)"},nocontact:{t:"Нет связи",c:"var(--st-nocontact)"}};
const stOf=a=>ST[a.status]?a.status:"plan";
function allAppts(){const r=[];patients.filter(visP).forEach(p=>(p.visits||[]).forEach(a=>r.push({...a,pid:p.id,name:p.name})));return r.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}
function visitDays(){const s=new Set();patients.forEach(p=>(p.visits||[]).forEach(v=>v.date&&s.add(v.date+"|"+p.id)));return s}

function render(){permCss(); renderInner(); if(view.screen==="settings")fillNames()}
function renderInner(){
  const app=$("#app"), prev=document.body.dataset.screen;
  if(prev==="list"&&view.screen!=="list")listY=scrollY;
  const keepY=prev==="list"&&view.screen==="list"?scrollY:null;
  document.body.dataset.screen=view.screen;
  if(view.screen==="day"){app.innerHTML=dayScreen();return}
  if(view.screen==="patient"){const p=patients.find(x=>x.id===view.pid); if(p){app.innerHTML=patientView(p);return} view.screen="list"}
  if(view.screen==="search"){app.innerHTML=`<header class="top"><button class="icon" data-a="home" aria-label="К календарю">‹</button>
      <input class="search" id="q" type="search" autocomplete="off" style="flex:1;min-width:0"></header>
      <div class="list" id="plist">${listRows()}</div>`;
    const s=$("#q"); s.value=q; s.oninput=e=>{q=e.target.value; $("#plist").innerHTML=listRows()}; return}
  if(view.screen==="trash"){app.innerHTML=trashScreen(); return}
  if(view.screen==="stats"){if(!canDo("stats")){view={screen:"list",pid:null}} else {app.innerHTML=statsScreen(); return}}
  if(view.screen==="settings"||view.screen==="docs"){if(!iAmOwner){view={screen:"list",pid:null}} else {app.innerHTML=settingsScreen(); fillNames(); return}}
  if(view.screen==="all"){app.innerHTML=`<header class="top"><button class="icon" data-a="home" aria-label="К календарю">‹</button>
      <div class="brand"><b>Все пациенты</b><span>${patients.length} в базе</span></div><div class="pill grp"><button data-a="trash" aria-label="Корзина" style="position:relative">${ICON.trash}${trash.length?`<span class="badge">${trash.length}</span>`:""}</button><button data-a="newp" aria-label="Добавить пациента">${ICON.plus}</button></div></header>
      <div class="list" id="plist">${listRows()}</div>`; return}
  app.innerHTML=listView();
  if(keepY!=null)scrollTo(0,keepY);
  else if(listY!=null&&!firstList)scrollTo(0,listY);
  else {const now=new Date(); scrollToMonth(cal.y,cal.m,false)}
  if(loaded)firstList=false;
  updTitle();
}

/* ---------- crop / rotate before upload ---------- */
let crop=null; const CS=600;
async function openCrop(file,target){let img; try{img=await createImageBitmap(file)}catch(e){try{img=await new Promise((ok,no)=>{const im=new Image(); im.onload=()=>ok(im); im.onerror=no; im.src=URL.createObjectURL(file)})}catch(_){toast("Не удалось открыть фото");return}}
  crop={img,target,pid:view.pid,back:sheet,rot:0,fine:0,z:1,x:0,y:0,flip:false}; sheet={kind:"crop"}; drawSheet(); requestAnimationFrame(drawCrop)}
function cropDraw(ctx,S){const c=crop, w=c.img.width, h=c.img.height, a=(c.rot+c.fine)*Math.PI/180;
  const bw=Math.abs(w*Math.cos(a))+Math.abs(h*Math.sin(a)), bh=Math.abs(w*Math.sin(a))+Math.abs(h*Math.cos(a)); const sc=Math.max(S/bw,S/bh)*c.z, k=S/CS;
  ctx.save(); ctx.fillStyle="#fff"; ctx.fillRect(0,0,S,S); ctx.translate(S/2+c.x*k,S/2+c.y*k); ctx.rotate(a); if(c.flip)ctx.scale(-1,1); ctx.drawImage(c.img,-w*sc/2,-h*sc/2,w*sc,h*sc); ctx.restore()}
function drawCrop(){const cv=$("#cropcv"); if(!cv||!crop)return; cropDraw(cv.getContext("2d"),CS)}
async function finishCrop(){const c=crop; if(!c)return; const out=document.createElement("canvas"); out.width=out.height=900; cropDraw(out.getContext("2d"),900);
  const blob=await new Promise(r=>out.toBlob(b=>r(b),"image/jpeg",.88)); const btn=document.querySelector('[data-a="cropok"]'); if(btn)btn.disabled=true;
  try{if(!assetsNs)throw {code:"not_granted"}; const r=await assetsNs.upload(blob,{type:"image/jpeg"}); crop=null;
    if(c.target==="pava"){sheet=null; drawSheet(); const pp=patients.find(x=>x.id===c.pid); const pc=clone(pp); pc.photos=pc.photos||[]; pc.photos.push({id:uid(),asset:r.id,date:today(),cat:"Анфас"}); pc.photo=r.id; await savePatient(pc)}
    else if(c.target==="doc"){sheet=c.back; sheet.d.photo=r.id; drawSheet()}
    else if(c.target==="me"){profiles[myId]={...(profiles[myId]||{}),photo:r.id}; sheet={kind:"me"}; drawSheet(); render(); await db.doc("profiles/"+myId).set({photo:r.id})}
  }catch(err){upErr(err); if(btn)btn.disabled=false}}
(()=>{const pts=new Map(); let start=null;
  document.addEventListener("pointerdown",e=>{if(e.target.id!=="cropcv"||!crop)return; e.target.setPointerCapture?.(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); start={x:crop.x,y:crop.y,z:crop.z,pts:new Map([...pts].map(([k,v])=>[k,{...v}]))}});
  document.addEventListener("pointermove",e=>{if(!crop||!pts.has(e.pointerId))return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); const cv=$("#cropcv"); const k=CS/cv.getBoundingClientRect().width;
    const ids=[...pts.keys()];
    if(ids.length===1){const p0=start.pts.get(ids[0])||pts.get(ids[0]), p=pts.get(ids[0]); crop.x=start.x+(p.x-p0.x)*k; crop.y=start.y+(p.y-p0.y)*k}
    else if(ids.length>=2&&start.pts.size>=2){const [a,b]=ids, a0=start.pts.get(a), b0=start.pts.get(b), a1=pts.get(a), b1=pts.get(b); if(a0&&b0){const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y), d1=Math.hypot(a1.x-b1.x,a1.y-b1.y); crop.z=Math.max(1,Math.min(5,start.z*d1/Math.max(1,d0))); const zr=$("#cropz"); if(zr)zr.value=crop.z}}
    drawCrop()});
  const up=e=>{if(!pts.has(e.pointerId))return; pts.delete(e.pointerId); start=crop?{x:crop.x,y:crop.y,z:crop.z,pts:new Map([...pts].map(([k,v])=>[k,{...v}]))}:null};
  document.addEventListener("pointerup",up); document.addEventListener("pointercancel",up);
  document.addEventListener("wheel",e=>{if(e.target.id!=="cropcv"||!crop)return; e.preventDefault(); crop.z=Math.max(1,Math.min(5,crop.z*(e.deltaY<0?1.08:1/1.08))); const zr=$("#cropz"); if(zr)zr.value=crop.z; drawCrop()},{passive:false});
  document.addEventListener("input",e=>{if(!crop)return; if(e.target.id==="cropz"){crop.z=+e.target.value; drawCrop()} if(e.target.id==="cropr"){crop.fine=+e.target.value; const l=$("#croprl"); if(l)l.textContent=(crop.fine>0?"+":"")+crop.fine+"°"; drawCrop()}});
})();

    case "dprev": shiftDay(-1); break;
    case "dnext": shiftDay(1); break;
    case "mtoday":{sel=today(); const d=new Date(); if(view.screen!=="list"){view={screen:"list",pid:null}; listY=null; render()}
      document.querySelectorAll(".cal .cell.sel").forEach(c=>c.classList.remove("sel")); document.querySelector('.cal .cell[data-d="'+sel+'"]')?.classList.add("sel");
      scrollToMonth(d.getFullYear(),d.getMonth(),true); break}
    case "showall": showAll=true; $("#hbody").innerHTML=homeBody(); break;
    case "hideall": showAll=false; $("#hbody").innerHTML=homeBody(); break;
    case "newa": view.screen==="patient"?openApptSheet(view.pid,null,today()):openApptSheet("",null,sel); break;
    case "edita":{const pp=patients.find(x=>x.id===t.dataset.pid); const ap=(pp?.visits||[]).find(x=>x.id===t.dataset.aid); if(ap)openApptSheet(pp.id,ap); break}
    case "status":{const pp=patients.find(x=>x.id===t.dataset.pid); const ap=(pp?.visits||[]).find(x=>x.id===t.dataset.aid); if(!ap||!canTouch(ap))break;
      sheet={kind:"s",pid:pp.id,aid:ap.id,name:pp.name,date:ap.date,time:ap.time,status:stOf(ap)}; drawSheet(); break}
    case "setst":{const pp=patients.find(x=>x.id===sheet.pid); const before=clone(pp); const pc=clone(pp); const ap=pc.visits.find(x=>x.id===sheet.aid);
      if(ap)ap.status=t.dataset.s; sheet=null; drawSheet(); savePatient(pc); toast("Статус: "+ST[t.dataset.s].t,()=>{savePatient(before);toast("Статус возвращён")}); break}

    case "amode": syncAppt(); sheet.mode=t.dataset.m; drawSheet(); break;
    case "savea":{syncAppt(); const a=sheet.a; let pid=a.pid; const befores=[];
      if(!a.date){toast("Укажите дату");break}
      if(sheet.isNew&&sheet.mode==="new"){const nm=(a.newName||"").trim(); if(!nm){toast("Впишите имя и фамилию");$("#an")?.focus();break}
        const pd=a.pdoc??getMe(); const np={id:uid(),name:nm,phone:(a.phone||"").trim(),birth:a.birth||"",sex:a.sex||"",note:(a.pnote||"").trim(),doctorId:pd||"",source:a.src||"",sourceNote:(a.srcd||"").trim(),visits:[{id:a.id,date:a.date,time:a.time||"",comment:(a.note||"").trim(),status:a.status||"plan",doctorId:pd||"",screws:[],elastics:[],bends:[]}]};
        sel=a.date; {const[y,m]=a.date.split("-").map(Number);cal={y,m:m-1}} sheet=null; drawSheet(); savePatient(np);
        toast("Добавлен на "+fmt(a.date)+(a.time?" в "+a.time:""),()=>{removePatientSilently(np.id);toast("Отменено")}); break}
      if(!pid){toast("Выберите пациента");break}
      const entry={id:a.id,date:a.date,time:a.time||"",comment:(a.note||"").trim(),status:a.status||"plan"};
      if(sheet.origPid&&sheet.origPid!==pid){const o=patients.find(x=>x.id===sheet.origPid); if(o){befores.push(clone(o)); const oc=clone(o); oc.visits=(oc.visits||[]).filter(x=>x.id!==a.id); savePatient(oc)}}
      const tp=patients.find(x=>x.id===pid); if(!befores.some(b=>b.id===pid))befores.push(clone(tp));
      const tc=clone(tp); tc.visits=tc.visits||[]; const i=tc.visits.findIndex(x=>x.id===a.id); if(i>=0)tc.visits[i]={...tc.visits[i],...entry}; else tc.visits.push({...entry,doctorId:tc.doctorId||getMe()||"",screws:[],elastics:[],bends:[]});
      sel=a.date; {const[y,m]=a.date.split("-").map(Number);cal={y,m:m-1}}
      const isNew=sheet.isNew; sheet=null; drawSheet(); savePatient(tc);
      toast(isNew?"Записан на "+fmt(a.date)+(a.time?" в "+a.time:""):"Запись изменена",()=>{befores.forEach(b=>b.gone?removePatientSilently(b.id):savePatient(b));toast("Отменено")}); break}
    case "dela": case "dela2":{const pid=sheet.origPid, vid=sheet.a.id; sheet=null; drawSheet(); deleteVisit(pid,vid); break}
    case "undo": if(undoFn){const f=undoFn;undoFn=null;$("#toast").hidden=true;f()} break;
    case "scrim": case "close": if(sheet?.kind==="crop"){const b=crop?.back; crop=null; sheet=(b&&b.kind==="doc")?b:(b&&b.kind==="me"?b:null); drawSheet(); break} sheet=null; drawSheet(); break;
    case "add": syncVisitFields(); sheet.v[t.dataset.k].push({}); drawSheet(); break;
    case "rm": syncVisitFields(); sheet.v[t.dataset.k].splice(+t.dataset.i,1); drawSheet(); break;
    case "delp": sheet.confirm=true; drawSheet(); break;
    case "noconf": sheet.confirm=false; drawSheet(); break;
    case "savep":{const s=sheet.p; s.name=$("#pn").value.trim(); s.phone=$("#pp").value.trim(); s.birth=$("#pbd")?.value||""; s.note=$("#pno").value.trim(); s.doctorId=$("#pdoc")?.value||""; s.source=$("#psrc")?.value||""; s.sourceNote=($("#psrcd")?.value||"").trim();
      if(!s.name){$("#pn").focus();toast("Введите имя пациента");break}
      const base=patients.find(x=>x.id===s.id); const np={...(base||{}),...s,visits:base?base.visits:s.visits};
      const prevP=base?clone(base):null;
      sheet=null; drawSheet(); if(!base)view={screen:"patient",pid:np.id}; savePatient(np);
      toast(base?"Изменения сохранены":"Пациент сохранён",base?()=>{savePatient(prevP);toast("Изменения отменены")}:null); break}
    case "delp2":{const id=sheet.p.id; const old=clone(patients.find(x=>x.id===id)); toTrash({kind:"patient",patient:clone(old)}); sheet=null; drawSheet(); removePatient(id);
      toast("Пациент удалён",()=>{savePatient(old);view={screen:"patient",pid:old.id};render();toast("Пациент восстановлен")}); break}
    case "savev":{syncVisitFields(); const v=sheet.v; if(!sheet.isNew&&!canEditVisit(patients.find(x=>x.id===sheet.pid)?.visits?.find(x=>x.id===v.id)))break; delete v._cU; delete v._cL; if(sheet.isNew)v.status=v.date>today()?"plan":"came"; v.upper=(v.upper||"").trim(); v.lower=(v.lower||"").trim();
      v.screws=v.screws.filter(s=>s.zone||s.note||s.len||s.dia); v.elastics=v.elastics.filter(x=>x.type); v.bends=v.bends.filter(b=>b.kind);
      const before=clone(patients.find(x=>x.id===sheet.pid)); const pt=clone(before); pt.visits=pt.visits||[];
      const i=pt.visits.findIndex(x=>x.id===v.id); if(i>=0)pt.visits[i]=v; else pt.visits.push(v);
      sheet=null; drawSheet(); savePatient(pt);
      toast(i>=0?"Визит исправлен":"Визит сохранён",()=>{savePatient(before);toast(i>=0?"Исправление отменено":"Визит убран")}); break}
    case "delv": case "delv2":{const pid=sheet.pid, vid=sheet.v.id; sheet=null; drawSheet(); deleteVisit(pid,vid); break}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet){sheet=null;drawSheet()}});

/* ---------- drag appointments to another day ---------- */
let drag=null, suppressClick=false, lpress=null, lpFired=false;
function moveAppt(pid,aid,date,hour){
  const pp=patients.find(x=>x.id===pid); if(!pp)return; const ap=(pp.visits||[]).find(x=>x.id===aid); if(!ap)return;
  const nt=hour==null?ap.time:pad2(hour)+":"+((ap.time||"").slice(3,5)||"00");
  if(ap.date===date&&ap.time===nt)return;
  const before=clone(pp), pc=clone(pp); const t2=pc.visits.find(x=>x.id===aid); t2.date=date; t2.time=nt;
  sel=date; savePatient(pc);
  toast(pp.name.split(" ")[0]+" → "+(hour==null?fmt(date):nt),()=>{savePatient(before);toast("Перенос отменён")});
}
function endDrag(){
  if(!drag)return; clearTimeout(drag.timer); clearInterval(drag.et); clearInterval(drag.vt); document.querySelectorAll(".edgehint").forEach(x=>x.remove());
  if(drag.ghost)drag.ghost.remove(); drag.src.classList.remove("dragsrc");
  document.querySelectorAll(".drop").forEach(c=>c.classList.remove("drop")); document.body.classList.remove("dragging");
  drag=null;
}
let rz=null, drag0Off=0;
document.addEventListener("pointerdown",e=>{
  if(sheet||(e.pointerType==="mouse"&&e.button!==0))return;
  const hnd=e.target.closest("[data-rz]");
  if(hnd){const box=hnd.closest(".evbox"); const v=patients.find(x=>x.id===box.dataset.pid)?.visits?.find(x=>x.id===box.dataset.aid);
    if(!v||!canDo("move")||!canTouch(v))return; e.preventDefault();
    rz={box,pid:box.dataset.pid,aid:box.dataset.aid,edge:hnd.dataset.rz,y:e.clientY,id:e.pointerId,s:toMin(v.time),d:+v.dur||60,h0:+box.closest(".tl2").dataset.h0}; rz.ns=rz.s; rz.nd=rz.d;
    box.classList.add("rzing"); try{hnd.setPointerCapture(e.pointerId)}catch(_){} return}
  let src=e.target.closest("[data-drag]");
  if(src){const v=patients.find(x=>x.id===src.dataset.pid)?.visits?.find(x=>x.id===src.dataset.aid); if(!canDo("move")||!canTouch(v)){if(canDo("del")&&canTouch(v)){} else return}}
  if(!src){const lp=e.target.closest("[data-lp]"); if(!lp||!(canDo("book")||(clip&&canDo("move"))))return;
    lpress={x:e.clientX,y:e.clientY,id:e.pointerId,timer:setTimeout(()=>{lpress=null; lpFired=true; suppressClick=true; navigator.vibrate?.(20);
      const d=lp.dataset.d, h=lp.dataset.h!=null?+lp.dataset.h:null;
      if(clip){sheet={kind:"lpm",d,h}; drawSheet()} else openApptSheet("",null,d,h!=null?pad2(h)+":00":null,"new")},650)};
    return}
  {const bx=src.closest(".evbox"); drag0Off=bx?e.clientY-bx.getBoundingClientRect().top:0}
  drag={src,pid:src.dataset.pid,aid:src.dataset.aid,x:e.clientX,y:e.clientY,id:e.pointerId,active:false};
  drag.timer=setTimeout(()=>{if(!drag)return; drag.active=true; navigator.vibrate?.(15);
    const pp=patients.find(x=>x.id===drag.pid), ap=(pp?.visits||[]).find(x=>x.id===drag.aid);
    const g=document.createElement("div"); g.className="dragghost"; g.textContent=(ap?.time||"")+" "+shortName(pp?.name);
    g.style.left=drag.x+"px"; g.style.top=drag.y+"px"; document.body.appendChild(g); drag.ghost=g;
    src.classList.add("dragsrc"); document.body.classList.add("dragging");
    try{src.setPointerCapture(drag.id)}catch(_){}
  },e.pointerType==="mouse"?180:380);
});
document.addEventListener("pointermove",e=>{
  if(rz&&e.pointerId===rz.id){const dm=Math.round((e.clientY-rz.y)/PXH*60/15)*15;
    if(rz.edge==="b"){rz.ns=rz.s; rz.nd=Math.max(15,Math.min(24*60-rz.s,rz.d+dm))} else {rz.ns=Math.max(0,Math.min(rz.s+rz.d-15,rz.s+dm)); rz.nd=rz.s+rz.d-rz.ns}
    rz.box.style.top=((rz.ns-rz.h0*60)/60*PXH)+"px"; rz.box.style.height=Math.max(28,rz.nd/60*PXH)+"px";
    const tm=rz.box.querySelector(".evtm"); if(tm)tm.textContent=toT(rz.ns)+"–"+toT(rz.ns+rz.nd); return}
  if(lpress&&e.pointerId===lpress.id&&Math.hypot(e.clientX-lpress.x,e.clientY-lpress.y)>8){clearTimeout(lpress.timer);lpress=null}
  if(!drag||e.pointerId!==drag.id)return;
  if(!drag.active){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8)endDrag();return}
  if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>12)drag.moved=true;
  drag.ghost.style.left=e.clientX+"px"; drag.ghost.style.top=e.clientY+"px";
  if(view.screen==="list"){const vy=e.clientY<headH()+30?-1:e.clientY>innerHeight-90?1:0;
    if(vy!==(drag.vy||0)){clearInterval(drag.vt); drag.vy=vy; if(vy)drag.vt=setInterval(()=>scrollBy(0,vy*14),16)}}
  const ex=view.screen==="day"?(e.clientX<40?-1:e.clientX>innerWidth-40?1:0):0;
  if(ex!==(drag.edge||0)){clearInterval(drag.et); document.querySelectorAll(".edgehint").forEach(x=>x.remove()); drag.edge=ex;
    if(ex){const h=document.createElement("div"); h.className="edgehint"; h.style.cssText=ex<0?"left:0;--dir:to left":"right:0;--dir:to right"; document.body.appendChild(h);
      drag.et=setInterval(()=>{view.screen==="day"?shiftDay(ex):shiftMonth(ex)},750)}}
  const cell=document.elementFromPoint(e.clientX,e.clientY)?.closest(".cell,.hrow,[data-dropday]");
  document.querySelectorAll(".drop").forEach(c=>c!==cell&&c.classList.remove("drop")); if(cell)cell.classList.add("drop");
});
document.addEventListener("pointerup",e=>{
  if(rz&&e.pointerId===rz.id){const r=rz; rz=null; r.box.classList.remove("rzing"); suppressClick=true; setTimeout(()=>suppressClick=false,350);
    if(r.ns!==r.s||r.nd!==r.d){const pp=patients.find(x=>x.id===r.pid); const pc=clone(pp); const v=pc.visits.find(x=>x.id===r.aid); v.time=toT(r.ns); v.dur=r.nd; savePatient(pc)} return}
  if(lpress){clearTimeout(lpress.timer);lpress=null}
  if(lpFired){lpFired=false; setTimeout(()=>suppressClick=false,350)}
  if(!drag||e.pointerId!==drag.id)return;
  if(drag.active&&!drag.moved){const {pid,aid}=drag; suppressClick=true; setTimeout(()=>suppressClick=false,400); endDrag(); openApptMenu(pid,aid); return}
  if(drag.active&&!canDo("move")){endDrag(); return}
  if(drag.active){const cell=document.elementFromPoint(e.clientX,e.clientY)?.closest(".cell,.hrow,[data-dropday]"); const {pid,aid}=drag;
    suppressClick=true; setTimeout(()=>suppressClick=false,400); endDrag();
    const tl=document.querySelector(".tl2"); const tr=tl?.getBoundingClientRect();
    if(tl&&!cell?.dataset?.dropday&&e.clientY>=tr.top&&e.clientY<=tr.bottom&&e.clientX>=tr.left){const h0=+tl.dataset.h0; const pp=patients.find(x=>x.id===pid), v=pp?.visits?.find(x=>x.id===aid);
      if(v){let m=h0*60+Math.round(((e.clientY-tr.top)-(drag0Off||0))/PXH*60/15)*15; m=Math.max(0,Math.min(24*60-15,m)); if(!(v.date===sel&&v.time===toT(m))){const pc=clone(pp); const t2=pc.visits.find(x=>x.id===aid); t2.date=sel; t2.time=toT(m); savePatient(pc)}}}
    else if(cell){if(cell.dataset.dropday)moveAppt(pid,aid,cell.dataset.dropday); else if(cell.classList.contains("hrow"))moveAppt(pid,aid,cell.dataset.d,+cell.dataset.h); else moveAppt(pid,aid,cell.dataset.d)}}
  else endDrag();
});
document.addEventListener("pointercancel",()=>{if(lpress){clearTimeout(lpress.timer);lpress=null} if(lpFired){lpFired=false;setTimeout(()=>suppressClick=false,350)} endDrag()});
document.addEventListener("touchmove",e=>{if(drag?.active||rz)e.preventDefault()},{passive:false});
document.addEventListener("contextmenu",e=>{if(e.target.closest("[data-drag],[data-lp]"))e.preventDefault()});
/* ---------- swipe: months on the calendar, days inside a day ---------- */
let sw=null;
document.addEventListener("touchstart",e=>{
  if(sheet||e.touches.length!==1)return;
  const onCal=false, onDay=view.screen==="day"&&e.target.closest("#app");
  if(!onCal&&!onDay){sw=null;return}
  const t=e.touches[0]; sw={x:t.clientX,y:t.clientY,t:Date.now(),kind:onCal?"m":"d"};
},{passive:true});
document.addEventListener("touchend",e=>{
  if(!sw)return; const s=sw; sw=null;
  if(drag?.active||lpFired||sheet||suppressClick)return;
  const t=e.changedTouches[0], dx=t.clientX-s.x, dy=t.clientY-s.y;
  if(Date.now()-s.t>700||Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.5)return;
  suppressClick=true; setTimeout(()=>suppressClick=false,300);
  const n=dx<0?1:-1; s.kind==="m"?shiftMonth(n):shiftDay(n);
},{passive:true});
document.addEventListener("click",e=>{if(suppressClick){e.stopPropagation();e.preventDefault();suppressClick=false;return}
  const d=e.target.closest("[data-drag]"); if(!d||sheet)return; const k=d.dataset.aid, now=Date.now();
  if(lastTap.k===k&&now-lastTap.t<330){lastTap={k:"",t:0}; clearTimeout(pendingTap); e.stopPropagation(); e.preventDefault(); openApptMenu(d.dataset.pid,k); return}
  lastTap={k,t:now};},true);

/* ---------- boot ---------- */
Object.defineProperty(window,"doctors",{get:()=>doctors}); Object.defineProperty(window,"claims",{get:()=>claims}); Object.defineProperty(window,"sheet",{get:()=>sheet});
let loaded=false;
render();
(async()=>{
  try{db=window.claude?.use?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){useLocal=true; loadLocal(); try{doctors=JSON.parse(localStorage.getItem(DKEY)||"[]")}catch(e){doctors=[]} try{trash=JSON.parse(localStorage.getItem(TKEY)||"[]")}catch(e){trash=[]} purgeTrash(); loaded=true; render(); return}
  try{userNs=await window.claude.use("user")}catch(e){userNs=null}
  window.claude.use("assets").then(a=>{assetsNs=a; render()}).catch(()=>{});
  db.collection("profiles").onSnapshot(snap=>{profiles={}; snap.docs.forEach(d=>profiles[d.id]=d.data()); render()},()=>{});
  window.claude.use("downloads").then(d=>{dlNs=d; if(view.screen==="stats")render()}).catch(()=>{});
  if(userNs){iAmOwner=await userNs.isOwner(); myId=await userNs.id(); if(myId===null&&!iAmOwner)iAmOwner=false}
  render();
  db.collection("claims").onSnapshot(snap=>{claims=snap.docs.map(d=>({id:d.id,...clone(d.data())})); render()},()=>{});
  db.collection("doctors").onSnapshot(snap=>{doctors=snap.docs.map(d=>({id:d.id,...clone(d.data())})); render()},()=>{});
  let tFirst=true;
  db.collection("trash").onSnapshot(snap=>{trash=snap.docs.map(d=>({id:d.id,...clone(d.data())})); if(tFirst&&!snap.metadata.fromCache){tFirst=false; purgeTrash()} if(view.screen==="trash"||view.screen==="all")render()},()=>{});
  const timer=setTimeout(()=>{if(!loaded){const el=$("#loading"); if(el)el.textContent="Не удаётся связаться с хранилищем. Проверьте интернет."}},10000);
  db.collection("patients").onSnapshot(snap=>{
    patients=snap.docs.map(d=>({id:d.id,...clone(d.data())}));
    if(!snap.metadata.fromCache)patients.forEach(p=>{if(p.appts&&norm(p)){const {id,...body}=p; db.doc("patients/"+id).set(body).catch(()=>{})}});
    patients.forEach(norm);
    if(!snap.metadata.fromCache){loaded=true;clearTimeout(timer)}
    if(snap.size)loaded=true;
    render();
  },err=>{clearTimeout(timer); useLocal=true; loadLocal(); loaded=true; render(); toast("Хранилище недоступно, работаю локально")});
})();
</script>

<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
